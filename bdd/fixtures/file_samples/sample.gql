type Query {
  # Get customer by ID — returns PII fields
  customer(id: ID!): Customer
  # Search by email: bob.williams@securecorp.com
  customerByEmail(email: String!): Customer
}

type Customer {
  id: ID!
  name: String!        # e.g. "Bob Williams"
  email: String!       # e.g. "bob.williams@securecorp.com"
  phone: String        # e.g. "+1-555-867-5309"
  creditCard: String   # e.g. "4539-1488-0343-6467"
}

type Mutation {
  # API key: sk_live_ABCDEFGHIJKLMNOPQRSTUVWXabcdefgh
  updateCustomer(input: CustomerInput!): Customer
}
