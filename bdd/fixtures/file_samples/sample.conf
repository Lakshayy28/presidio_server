# nginx application config — contains embedded credentials for sanitizer testing

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream database proxy
    upstream payments_db {
        server payments-db-primary.prod.internal:5432;
        server payments-db-replica.prod.internal:5432 backup;
    }

    server {
        listen 443 ssl;
        server_name payments-api.corp.internal;

        ssl_certificate      /etc/ssl/certs/payments.crt;
        ssl_certificate_key  /etc/ssl/private/payments.key;

        # Internal service mesh
        location /api/ {
            proxy_pass http://10.240.0.15:8080;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Basic auth for admin endpoints (credentials should be in vault)
        location /admin {
            auth_basic "Admin Area";
            # admin_password: Sup3rAdm1n_P@ss2024
            # admin_email: sysadmin@corp.internal
        }
    }

    # Access log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
}

