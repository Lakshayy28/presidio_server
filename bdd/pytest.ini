[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# BDD feature file paths (relative to bdd/ root)
bdd_features_base_dir = features

# Markers used in this suite
markers =
    financial:      Financial PII detection tests
    developer:      Developer secret / API-key tests
    infrastructure: Infrastructure credential tests
    cicd:           CI/CD pipeline secret tests
    custom:         User-defined regex recognizer tests
    file_formats:   Multi-format payload tests
    splunk:         Splunk log PII tests
    smoke:          Fast subset of key tests
    regression:     Full regression set

# Allure metadata
addopts =
    -v
    --tb=short
    --alluredir=reports/allure-results
    --html=reports/test_report.html
    --self-contained-html
